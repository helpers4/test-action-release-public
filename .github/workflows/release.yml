name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        default: auto
        options: [auto, patch, minor, major, alpha, beta, rc, resume]
      dry-run:
        type: boolean
        default: false
      all-registries:
        description: Dry-run npm, crates and JSR (only with dry-run)
        type: boolean
        default: false
permissions: {}
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions: { contents: read }
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: helpers4/action-release@fix/detached-tags   # the action under test
        with:
          bump: ${{ inputs.bump }}
          dry-run: ${{ inputs.dry-run }}
          version-files: package.json
          since-json: api-since.json
          targets: "${{ inputs.all-registries && '[{ npm: packages/npm }, { crates: crates/sandbox }, { jsr: jsr }]' || '' }}"
          app-id: ${{ vars.HELPERS4_BOT_ID }}
          app-key: ${{ secrets.HELPERS4_BOT_KEY }}
