name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        default: auto
        options: [auto, patch, minor, major, alpha, beta, rc, resume]
      dry-run:
        type: boolean
        default: false
      config:
        type: choice
        default: .github/release.yml
        options: [.github/release.yml, .github/release-all.yml]
permissions: {}
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions: { contents: read }
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: helpers4/action-release@feat/rewrite   # the action under test
        with:
          bump: ${{ inputs.bump }}
          dry-run: ${{ inputs.dry-run }}
          config: ${{ inputs.config }}
          app-id: ${{ vars.HELPERS4_BOT_ID }}
          app-key: ${{ secrets.HELPERS4_BOT_KEY }}
